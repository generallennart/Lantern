<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern</title>
<style>
  :root {
    --bg:#fff; --fg:#1a1a1a; --soft:#6b6b70; --line:#8a8b91;
    --accent:#0f7a5a; --accent-fg:#fff; --accent-soft:#e8f4ef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#202123; --fg:#ececef; --soft:#a0a0a8; --line:#76777c;
            --accent:#19a97b; --accent-fg:#08130f; --accent-soft:#17322a; }
  }
  * { box-sizing: border-box; }
  body {
    width: 316px; margin: 0; padding: 15px;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { color: var(--soft); font-size: 11.5px; margin-bottom: 13px; }
  .box { border: 1px solid var(--line); border-radius: 10px; padding: 11px; margin-bottom: 10px; }
  .lbl { display: block; font-weight: 600; font-size: 12px; margin-bottom: 6px; }
  /* A segmented row rather than a dropdown: every option is visible, each is a
     full-height target, and the sample text inside each button is set at the
     size it selects — so the choice shows itself instead of naming itself. */
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    flex: 1 1 calc(33.333% - 4px); min-width: 0; padding: 7px 4px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font: inherit; line-height: 1.1;
  }
  .seg button[data-size="small"]  { font-size: 11px; }
  .seg button[data-size="normal"] { font-size: 12.5px; }
  .seg button[data-size="gross"]  { font-size: 14px; }
  .seg button[data-size="sehr"]   { font-size: 15.5px; }
  .seg button[data-size="riesig"] { font-size: 17px; }
  .seg button:hover { border-color: var(--accent); }
  .seg button[aria-pressed="true"] {
    border-color: var(--accent); color: var(--accent); font-weight: 700;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .swatches { display: flex; gap: 8px; }
  .swatches button {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; padding: 0;
    background: var(--sw); border: 2px solid transparent;
    box-shadow: 0 0 0 1px var(--line);
  }
  .swatches button:hover { box-shadow: 0 0 0 2px var(--soft); }
  .swatches button[aria-pressed="true"] {
    border-color: var(--bg); box-shadow: 0 0 0 2px var(--fg);
  }
  label.row { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
  label.row input { accent-color: var(--accent); margin: 2px 0 0; flex: none; }
  .row span b { display: block; font-weight: 600; font-size: 12px; }
  .row span i { font-style: normal; color: var(--soft); font-size: 11.5px; }
  select { width: 100%; font: inherit; padding: 6px 8px; border-radius: 8px;
           border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button.act {
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px;
    background: var(--bg); color: var(--fg);
  }
  button.act:hover { border-color: var(--accent); color: var(--accent); }
  .done { color: var(--accent); font-size: 11.5px; margin-top: 7px; }
  .diag { margin-top: 9px; font-size: 11.5px; line-height: 1.7; }
  .diag div { display: flex; gap: 7px; align-items: baseline; }
  .diag b { font-weight: 600; }
  .diag .yes { color: var(--accent); }
  .diag .no { color: #c0392b; }
  @media (prefers-color-scheme: dark) { .diag .no { color: #ef8a7a; } }
  .hint { background: var(--accent-soft); color: var(--accent); border-radius: 8px;
          padding: 9px 10px; font-size: 11.5px; }
  .update {
    margin-bottom: 10px; padding: 10px; border-left: 3px solid var(--accent);
    background: var(--accent-soft); color: var(--fg);
  }
  .update[hidden] { display: none; }
  .update b { display: block; font-size: 12px; }
  .update p { margin: 4px 0 0; color: var(--soft); font-size: 11.5px; }
  .update .warn-row { margin-top: 9px; }
  .warn { margin-top: 9px; font-size: 11.5px; color: var(--soft); }
  details.adv > summary { font-weight: 600; font-size: 12px; cursor: pointer; }
  details.adv[open] > summary { margin-bottom: 9px; }
  details.adv input[type=url] {
    width: 100%; font: inherit; font-size: 12px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .sub.small { margin: 6px 0 0; }
  .stats { font-size: 11.5px; line-height: 1.7; }
  .stats .line { display: flex; justify-content: space-between; gap: 10px; }
  .stats .line b { font-weight: 600; }
  .stats .kinds { color: var(--soft); margin-top: 3px; }
  /* The router histogram. Its whole job is to show whether the threshold is
     where the user's actual requests fall, so the threshold is drawn on it. */
  .hist { display: flex; align-items: flex-end; gap: 2px; height: 34px; margin: 9px 0 3px; }
  /* Height is the count; opacity is which side of the router's line it falls
     on. Empty buckets fade almost out, so a bar you can see is a bar with
     something in it — the first version painted empty above-threshold buckets
     more strongly than the populated one below, which read as the opposite of
     the truth. */
  .hist .b { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0;
             min-height: 2px; opacity: .38; }
  .hist .b.over { opacity: 1; }
  .hist .b.zero { opacity: .12; }
  .hist-ax { display: flex; gap: 2px; font-size: 9.5px; color: var(--soft); }
  .hist-ax span { flex: 1; text-align: center; }
  .hist-ax span.mark { color: var(--accent); font-weight: 700; }
  .warn-row { display: flex; gap: 7px; margin-top: 8px; }
  button.act.danger { color: #c0392b; border-color: #c0392b; }
  button.act.danger:hover { background: #c0392b; color: #fff; border-color: #c0392b; }
  @media (prefers-color-scheme: dark) {
    button.act.danger { color: #ef8a7a; border-color: #7c3a30; }
    button.act.danger:hover { background: #8c3a2c; color: #fff; border-color: #8c3a2c; }
  }
  kbd { border: 1px solid currentColor; border-radius: 4px; padding: 0 3px;
        font: inherit; font-size: 11px; opacity: .8; }
  .ver { margin-top: 11px; font-size: 11px; color: var(--soft); }
</style>
</head>
<body>
  <h1>Lantern</h1>
  <div class="sub" data-t="pSub"></div>
  <div class="update" id="updateBox" hidden aria-live="polite">
    <b id="updateTitle"></b>
    <p id="updateBody"></p>
    <div class="warn-row">
      <button class="act" id="updateGuide" data-t="pUpdateGuide"></button>
      <button class="act" id="updateRelease" data-t="pUpdateRelease"></button>
    </div>
  </div>

  <div class="box">
    <label class="lbl" for="lang" data-t="pLanguage"></label>
    <select id="lang">
      <option value="auto" data-t="pAuto"></option>
      <option value="de">Deutsch</option>
      <option value="en">English</option>
    </select>
  </div>

  <!-- Two settings about the reader's eyes rather than about Lantern's
       behaviour, so they sit at the top where somebody who needs them will
       find them without reading past four things they do not. -->
  <div class="box">
    <div class="lbl" data-t="pSize"></div>
    <div class="seg" id="sizeSeg" role="group">
      <button type="button" data-size="small" data-t="pSizeSmall"></button>
      <button type="button" data-size="normal" data-t="pSizeNormal"></button>
      <button type="button" data-size="gross" data-t="pSizeGross"></button>
      <button type="button" data-size="sehr" data-t="pSizeSehr"></button>
      <button type="button" data-size="riesig" data-t="pSizeRiesig"></button>
    </div>
    <div class="sub small" data-t="pSizeHint"></div>
  </div>

  <div class="box">
    <div class="lbl" data-t="pAccent"></div>
    <div class="swatches" id="accentSeg" role="group">
      <button type="button" data-accent="green"  style="--sw:#0f7a5a" data-t-label="pAccentGreen"></button>
      <button type="button" data-accent="blue"   style="--sw:#1256a8" data-t-label="pAccentBlue"></button>
      <button type="button" data-accent="violet" style="--sw:#6b3fa0" data-t-label="pAccentViolet"></button>
      <button type="button" data-accent="rose"   style="--sw:#a6325e" data-t-label="pAccentRose"></button>
      <button type="button" data-accent="slate"  style="--sw:#3f5262" data-t-label="pAccentSlate"></button>
    </div>
    <div class="sub small" data-t="pAccentHint"></div>
  </div>

  <div class="box">
    <label class="row">
      <input type="checkbox" id="pagelayer">
      <span><b data-t="pPage"></b><i data-t="pPageHint"></i></span>
    </label>
  </div>

  <div class="box">
    <label class="row">
      <input type="checkbox" id="statuscheck">
      <span><b data-t="pStatus"></b><i data-t="pStatusHint"></i></span>
    </label>
  </div>

  <div class="box">
    <label class="row">
      <input type="checkbox" id="updatecheck">
      <span><b data-t="pUpdateCheck"></b><i data-t="pUpdateCheckHint"></i></span>
    </label>
  </div>

  <div class="box">
    <button class="act" id="intro" data-t="pIntro"></button>
    <div class="done" id="introDone" hidden data-t="pIntroDone"></div>
  </div>

  <div class="box">
    <button class="act" id="diag" data-t="pDiag"></button>
    <div class="diag" id="diagOut" hidden></div>
  </div>

  <div class="box" id="statsBox" hidden>
    <div class="lbl" data-t="pStats"></div>
    <div class="stats" id="statsOut"></div>
    <div class="sub small" data-t="pStatsPrivacy"></div>
  </div>

  <details class="box adv">
    <summary data-t="pAdvanced"></summary>
    <label class="lbl" for="rulesUrl" data-t="pRules"></label>
    <input type="url" id="rulesUrl" placeholder="https://…/rules.json" spellcheck="false">
    <div class="sub small" data-t="pRulesHint"></div>
    <div class="warn-row">
      <button class="act" id="rulesCheck" data-t="pRulesCheck"></button>
    </div>
    <div class="diag" id="rulesOut" hidden></div>
  </details>

  <div class="box">
    <button class="act" id="reset" data-t="pReset"></button>
    <div class="warn" id="resetConfirm" hidden>
      <div data-t="pResetAsk"></div>
      <div class="warn-row">
        <button class="act danger" id="resetYes" data-t="pResetYes"></button>
        <button class="act" id="resetNo" data-t="pResetNo"></button>
      </div>
    </div>
    <div class="done" id="resetDone" hidden data-t="pResetDone"></div>
    <div class="warn" id="resetFailed" hidden data-t="pResetFailed"></div>
  </div>

  <div class="hint" data-t="pOpenHint"></div>
  <div class="ver"><span data-t="pFooter"></span> · <span id="rv">–</span></div>

  <script src="../src/store.js"></script>
  <script src="../src/providers.js"></script>
  <script src="../src/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
